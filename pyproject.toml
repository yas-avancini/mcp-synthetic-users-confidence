[project]
name = "synthetic-users-confidence"
version = "0.1.0"
description = "Servidor MCP que mede a fidelidade de usuários sintéticos a pessoas reais."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1", "pyarrow>=15", "sqlalchemy>=2"]
cofre = ["keyring>=25"]  # guarda a chave do RAG no cofre do sistema
excel = ["openpyxl>=3.1"]  # lê .xlsx
parquet = ["pyarrow>=15"]  # lê .parquet
sql = ["sqlalchemy>=2"]  # lê bancos SQL; instale também o driver do seu banco

[project.scripts]
synthetic-users-confidence = "synthetic_users_confidence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_users_confidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
